[project]
name = "adk-multi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.4,<0.4",
    "google-adk[a2a,db]==2.2.0",
    "sqlalchemy[asyncio]>=2,<3",
]

[dependency-groups]
dev = [
    "gepa>=0.1",
    "google-adk[eval]==2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# 台本モデルは pydantic の BaseLlm を継承するので、フィールドを ClassVar にはできない。
"**/test_*.py" = ["RUF012"]
"**/*_test.py" = ["RUF012"]
