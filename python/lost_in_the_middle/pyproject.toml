[project]
name = "agent-lost-in-the-middle"
version = "0.0.1"
description = "LLM が複数の文書の中央にある情報を使いにくい現象（lost-in-the-middle）と並べ替えの効果を、ローカルの LLM で小さく再現する実験"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
